services:
  - type: web
    name: money-munchkins-2
    runtime: node
    rootDir: products/money-munchkins-2
    buildCommand: npm install --prefix app && npm run build --prefix app
    startCommand: npm run start --prefix app
    healthCheckPath: /api/money-munchkins/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_PROVIDER
        value: stripe
      - key: PORT
        value: "10000"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
