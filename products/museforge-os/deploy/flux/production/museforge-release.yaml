apiVersion: v1
kind: Namespace
metadata:
  name: museforge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: museforge-app
  namespace: museforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: museforge
  template:
    metadata:
      labels:
        app: museforge
    spec:
      containers:
        - name: museforge
          image: ghcr.io/jazzu72/museforge-os:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3320
          env:
            - name: PORT
              value: "3320"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: museforge
  namespace: museforge
spec:
  selector:
    app: museforge
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
