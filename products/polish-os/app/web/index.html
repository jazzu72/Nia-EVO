<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polish OS - The Anti-Instagram Quantum Social Network</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #000000;
      --card-bg: #0E0E10;
      --border-color: #222;
      --accent-neon: #00F0FF;
      --accent-pink: #FF007A;
      --accent-gradient: linear-gradient(135deg, #FF007A, #00F0FF);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Plus Jakarta Sans", sans-serif; }
    body { background: var(--bg-dark); color: #F8FAFC; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    header { width: 100%; max-width: 680px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(12px); z-index: 10; }
    .brand { font-weight: 900; font-size: 1.4rem; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    main { width: 100%; max-width: 680px; padding: 24px 16px; flex: 1; display: flex; flex-direction: column; gap: 32px; }
    
    .manifesto-banner { background: linear-gradient(135deg, rgba(255,0,122,0.15), rgba(0,240,255,0.15)); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 20px; }
    .manifesto-banner h2 { font-size: 1.1rem; font-weight: 900; margin-bottom: 12px; color: var(--accent-neon); text-transform: uppercase; letter-spacing: 1px; }
    .features-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.855rem; color: #CBD5E1; }
    .feature-item { display: flex; align-items: center; gap: 8px; font-weight: 600; }

    .post-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .post-header { padding: 16px; display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 0.95rem; }
    .post-media { width: 100%; height: 380px; background: radial-gradient(circle, #1c1c2d 0%, #0a0a0f 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; text-align: center; padding: 20px; }
    .quantum-badge { position: absolute; bottom: 16px; right: 16px; background: rgba(0,0,0,0.8); border: 1px solid var(--accent-neon); padding: 8px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; color: var(--accent-neon); backdrop-filter: blur(8px); }
    .post-footer { padding: 16px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">✨ POLISH OS</div>
    <div style="font-size: 0.75rem; font-weight: 800; background: rgba(0,240,255,0.1); color: var(--accent-neon); padding: 6px 12px; border-radius: 99px; border: 1px solid rgba(0,240,255,0.3);">NO ADS • CHRONOLOGICAL • 4K LOSSLESS</div>
  </header>
  <main>
    <div class="manifesto-banner">
      <h2>Why Polish OS Wins vs. Instagram</h2>
      <div class="features-grid">
        <div class="feature-item">🚫 Zero Sponsored Ads</div>
        <div class="feature-item">⏰ 100% Chronological Feed</div>
        <div class="feature-item">💎 Native 4K Lossless Uploads</div>
        <div class="feature-item">💰 Creator Revenue Share</div>
      </div>
    </div>
    <div id="feedContainer"></div>
  </main>
  <script>
    async function loadFeed() {
      try {
        const res = await fetch("/api/polish/feed");
        const data = await res.json();
        const container = document.getElementById("feedContainer");
        container.innerHTML = data.posts.map(p => `
          <div class="post-card">
            <div class="post-header">
              <span>@${p.author.toLowerCase().replace(/\s+/g, "")}</span>
              <span style="color: var(--accent-neon); font-size: 0.8rem; font-weight: 800;">Quantum Verified</span>
            </div>
            <div class="post-media">
              <span style="color: #F8FAFC; font-weight: 800; font-size: 1.1rem; margin-bottom: 6px;">${p.caption}</span>
              <span style="color: #94A3B8; font-size: 0.85px;">⚡ AI Neural Resonance Sync Active</span>
              <div class="quantum-badge">Resonance: ${p.quantum_score}</div>
            </div>
            <div class="post-footer">
              <p style="font-weight: 800; margin-bottom: 8px; color: var(--accent-pink);">❤️ ${p.likes} Organic Applaud & Support</p>
              <p><strong style="margin-right: 8px; color: #F8FAFC;">${p.author}</strong><span style="color: #94A3B8;">Chronological stream index verified by House of Jazzu ledger.</span></p>
            </div>
          </div>
        `).join("");
      } catch(e) { console.error(e); }
    }
    window.onload = loadFeed;
  </script>
</body>
</html>
