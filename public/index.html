<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nia Capital OS</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#080b12;
  color:#e8edf7;
  font-family:Arial,sans-serif;
}
header{
  padding:24px;
  border-bottom:1px solid #20283a;
  background:#0d111b;
}
h1{margin:0;font-size:28px}
.sub{color:#8792a8;font-size:13px}
main{padding:20px;max-width:1200px;margin:auto}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:15px;
}
.card{
  background:#101622;
  border:1px solid #20283a;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
}
.label{
  color:#8792a8;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:8px;
}
.value{
  font-size:22px;
  font-weight:bold;
}
.ok{color:#36d399}
.warn{color:#f5b942}
pre{
  white-space:pre-wrap;
  word-break:break-word;
  color:#b9c4d8;
}
button{
  background:#1b6ef3;
  border:0;
  color:white;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
}
button:hover{opacity:.9}
.grant{
  padding:14px;
  border-bottom:1px solid #20283a;
}
.grant:last-child{border-bottom:0}
</style>
</head>

<body>

<header>
<h1>🏰 Nia Capital OS</h1>
<div class="sub">Owner-Controlled Capital Intelligence System</div>
</header>

<main>

<div class="grid">

<div class="card">
<div class="label">Runtime</div>
<div class="value ok" id="runtime">ONLINE</div>
</div>

<div class="card">
<div class="label">Health</div>
<div class="value" id="health">Checking...</div>
</div>

<div class="card">
<div class="label">Grant Drafts</div>
<div class="value" id="grantCount">Checking...</div>
</div>

<div class="card">
<div class="label">Execution Mode</div>
<div class="value warn">OWNER ONLY</div>
</div>

</div>

<div class="card">

<div class="label">System Status</div>

<pre id="status">Loading...</pre>

<button onclick="loadSystem()">Refresh</button>

</div>

<div class="card" id="grants">

<div class="label">Grant Draft Queue</div>

<div id="grantList">Loading...</div>

</div>

</main>

<script>

async function getJSON(url){

  const r = await fetch(url,{cache:"no-store"});

  return {
    status:r.status,
    data:await r.json()
  };

}

async function loadSystem(){

  try{

    const h = await getJSON("/api/health");

    document.getElementById("health").textContent =
      h.status === 200 ? "HEALTHY" : "ERROR";

    document.getElementById("status").textContent =
      JSON.stringify(h.data,null,2);

    const g = await getJSON("/api/owner/grant-drafts");

    const drafts = g.data.drafts || [];

    document.getElementById("grantCount").textContent =
      drafts.length;

    document.getElementById("grantList").innerHTML =
      drafts.map(x =>

        '<div class="grant">' +

        '<strong>' +
        escapeHTML(x.opportunity?.title || "Untitled") +
        '</strong><br>' +

        '<span class="sub">' +
        escapeHTML(
          x.preparationStatus || "UNKNOWN"
        ) +
        ' · OWNER REVIEW REQUIRED</span>' +

        '</div>'

      ).join("") || "No grant drafts.";

  }catch(e){

    document.getElementById("health").textContent="ERROR";

    document.getElementById("status").textContent=e.message;

  }

}

function escapeHTML(s){

  return String(s).replace(/[&<>"']/g,m => ({

    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"

  }[m]));

}

loadSystem();

</script>

</body>
</html>
