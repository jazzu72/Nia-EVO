<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nia — House of Jazzu</title>
<style>
body{margin:0;background:#080b12;color:#f5f7fb;font-family:system-ui,sans-serif}
.app{max-width:760px;margin:auto;height:100vh;display:flex;flex-direction:column}
header{padding:18px;border-bottom:1px solid #202636}
h1{margin:0;font-size:22px}
.status{font-size:12px;color:#71e6a8;margin-top:4px}
#chat{flex:1;overflow:auto;padding:18px}
.msg{padding:12px 15px;margin:10px 0;border-radius:14px;max-width:85%;white-space:pre-wrap}
.user{margin-left:auto;background:#1d3557}
.nia{background:#171c28}
form{display:flex;gap:8px;padding:12px;border-top:1px solid #202636}
input{flex:1;padding:14px;border-radius:12px;border:1px solid #30384a;background:#101520;color:white;font-size:16px}
button{padding:0 18px;border:0;border-radius:12px;background:#71e6a8;color:#06100b;font-weight:700}
</style>
</head>
<body>
<div class="app">
<header>
<h1>🏰 Nia</h1>
<div class="status">● HOUSE OF JAZZU — OWNER CHANNEL</div>
</header>

<div id="chat">
<div class="msg nia">I'm Nia. I'm ready to communicate with you.</div>
</div>

<form id="form">
<input id="message" autocomplete="off" placeholder="Talk to Nia..." />
<button>Send</button>
</form>
</div>

<script>
const TOKEN = localStorage.getItem("NIA_OWNER_AUTH_TOKEN");

if (!TOKEN) {
  const token = prompt("Enter Nia Owner Authentication Token");
  if (token) localStorage.setItem("NIA_OWNER_AUTH_TOKEN", token);
}

function add(text, cls) {
  const el=document.createElement("div");
  el.className="msg "+cls;
  el.textContent=text;
  document.getElementById("chat").appendChild(el);
  el.scrollIntoView();
}

document.getElementById("form").addEventListener("submit", async e=>{
  e.preventDefault();

  const input=document.getElementById("message");
  const message=input.value.trim();
  if(!message)return;

  add(message,"user");
  input.value="";
  add("Thinking…","nia");

  const thinking=document.querySelector("#chat .nia:last-child");

  try {
    const token=localStorage.getItem("NIA_OWNER_AUTH_TOKEN");

    const r=await fetch("/api/owner/chat/message",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+token
      },
      body:JSON.stringify({message})
    });

    const d=await r.json();

    thinking.remove();

    if(!r.ok || !d.ok){
      add("Nia connection error: "+(d.error||"UNKNOWN_ERROR"),"nia");
      return;
    }

    add(String(d.response || d.message || "No response received."),"nia");

  } catch(err) {
    thinking.remove();
    add("Connection failed: "+err.message,"nia");
  }
});
</script>
</body>
</html>
