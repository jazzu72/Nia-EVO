<!DOCTYPE html>
<html>
<head>
<title>Nia Real Estate Command Center</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;background:#111;color:white;padding:20px}
.card{background:#222;padding:20px;margin:10px 0;border-radius:10px}
h1{color:#00ff99}
</style>
</head>
<body>

<h1>🏰 Nia Real Estate Command Center</h1>

<div class="card" id="data">
Loading Nia...
</div>

<script>
async function load(){

const res=await fetch('/api/realestate/list');
if(!res.ok) throw new Error('Real Estate API HTTP '+res.status);
const data=await res.json();
const list=Array.isArray(data)?data:(data.properties||data.brokerages||data.items||data.data||[]);
document.getElementById('data').innerHTML=`
<h2>Status: ONLINE</h2>
<h3>Real Estate Network</h3>
<p>Records: ${list.length}</p>
${list.length ? list.map((x,i)=>`
<div class="card">
<strong>${String(x.name||x.address||x.property||x.id||'Record '+(i+1)).replace(/</g,'&lt;')}</strong>
<p>${String(x.status||x.type||'Active').replace(/</g,'&lt;')}</p>
</div>`).join('') : '<p>No real estate records currently registered.</p>'}
<h3>Available Operations</h3>
<p>✓ Brokerage / property records can be added through the Nia Real Estate API.</p>
<p>✓ Live records are loaded from /api/realestate/list.</p>
`;

}

load();
</script>

</body>
</html>
