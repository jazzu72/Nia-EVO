<!DOCTYPE html>
<html>
<head>
<title>Nia Real Estate Command Center</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;background:#111;color:white;padding:20px}
.card{background:#222;padding:20px;margin:10px 0;border-radius:10px}
h1{color:#00ff99}
</style>
</head>
<body>

<h1>🏰 Nia Real Estate Command Center</h1>

<div class="card">
<h2>Add Real Estate Record</h2>
<form id="addForm">
<input id="name" placeholder="Property / Brokerage Name" required style="width:100%;padding:12px;margin:6px 0;box-sizing:border-box">
<input id="address" placeholder="Address" style="width:100%;padding:12px;margin:6px 0;box-sizing:border-box">
<input id="type" placeholder="Type (Property, Brokerage, Lead)" style="width:100%;padding:12px;margin:6px 0;box-sizing:border-box">
<input id="value" type="number" placeholder="Estimated Value" style="width:100%;padding:12px;margin:6px 0;box-sizing:border-box">
<button style="padding:12px 20px;margin-top:8px;cursor:pointer">ADD TO NIA</button>
</form>
<div id="formStatus"></div>
</div>

<div class="card" id="data">Loading Nia...</div>

<script>
async function load(){

const res=await fetch('/api/realestate/list');
if(!res.ok) throw new Error('Real Estate API HTTP '+res.status);
const data=await res.json();
const list=Array.isArray(data)?data:(data.properties||data.brokerages||data.items||data.data||[]);
document.getElementById('data').innerHTML=`
<h2>Status: ONLINE</h2>
<h3>Real Estate Network</h3>
<p>Records: ${list.length}</p>
${list.length ? list.map((x,i)=>`
<div class="card">
<strong>${String(x.name||x.address||x.property||x.id||'Record '+(i+1)).replace(/</g,'&lt;')}</strong>
<p>${String(x.status||x.type||'Active').replace(/</g,'&lt;')}</p>
</div>`).join('') : '<p>No real estate records currently registered.</p>'}
<h3>Available Operations</h3>
<p>✓ Brokerage / property records can be added through the Nia Real Estate API.</p>
<p>✓ Live records are loaded from /api/realestate/list.</p>
`;

}

load();
</script>

<script>
document.getElementById('addForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const status=document.getElementById('formStatus');
 status.textContent='NIA is registering record...';
 try{
  const payload={
   name:document.getElementById('name').value.trim(),
   address:document.getElementById('address').value.trim(),
   type:document.getElementById('type').value.trim()||'Property',
   value:Number(document.getElementById('value').value)||0
  };
  const r=await fetch('/api/realestate/add',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify(payload)
  });
  const j=await r.json();
  if(!r.ok) throw new Error(j.error||'HTTP '+r.status);
  status.textContent='✓ Record registered with NIA.';
  e.target.reset();
  load();
 }catch(err){status.textContent='✗ '+err.message}
});
</script>
</body>
</html>
