services:
  - type: web
    name: nia-evo-3
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node revenue-api.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nia-evo-db
          property: connectionString

databases:
  - name: nia-evo-db
    databaseName: nia_evo
    user: nia_evo
    plan: free
