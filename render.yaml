services:
  - type: web
    name: nia-evo-3
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install
    startCommand: node start.js
    healthCheckPath: /api/capital/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NIA_MASTER_PASSWORD
        sync: false
      - key: NIA_OWNER_AUTH_TOKEN
        sync: false
      - key: SECRETS_PATH
        value: /etc/secrets/secrets.enc
